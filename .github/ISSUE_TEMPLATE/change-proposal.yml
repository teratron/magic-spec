name: Change proposal
description: Propose a new behaviour, command or improvement for the engine.
title: "[proposal] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the need before the solution. One proposal per issue, please.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What the engine should do instead, in plain words. A command example helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to meet the need, and why you prefer the proposal.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Who it affects
      description: The commands, files or projects the change would touch.
    validations:
      required: false
