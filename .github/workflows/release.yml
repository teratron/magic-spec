name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read version
        id: version
        run: echo "value=$(cat skills/magicspec/.version)" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        run: |
          # The files that go in are decided by scripts/archive-composition.js and nowhere else.
          node scripts/archive-composition.js list > release-files.txt
          python3 - <<'EOF'
          import zipfile, os

          version  = open("skills/magicspec/.version").read().strip()
          zip_name = f"magic-spec-v{version}.zip"
          prefix   = f"magic-spec-v{version}/"

          with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED) as zf:
              for f in open("release-files.txt").read().split():
                  zf.write(f, prefix + f)

          names = zipfile.ZipFile(zip_name).namelist()
          print(f"Created {zip_name}: {len(names)} files, {os.path.getsize(zip_name)/1024:.1f} KB")
          EOF

      - name: Smoke-check the archive
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          # Fails when any path lies outside the composition or a required file is missing.
          unzip -Z1 "magic-spec-v${VERSION}.zip" | node scripts/archive-composition.js check --prefix "magic-spec-v${VERSION}/"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_PROMPT_DISABLED: 1
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          ZIP="magic-spec-v${VERSION}.zip"
          TAG="v${VERSION}"

          cat > release-notes.md <<EOF
          ## Installation

          Download \`${ZIP}\` and extract into your project root:

          \`\`\`
          your-project/
          └── skills/
              └── magicspec/
          \`\`\`

          Then run `node skills/magicspec/scripts/executor.js init --host=<claude,codex,qwen>` from the project root — see the install section of the README.

          Full changelog: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)
          EOF

          for attempt in 1 2 3 4; do
            if gh release create "${TAG}" "${ZIP}" --title "${TAG}" --notes-file release-notes.md 2>release-error.log; then
              exit 0
            fi

            status=$?
            cat release-error.log

            if grep -qi "already exists" release-error.log; then
              gh release upload "${TAG}" "${ZIP}" --clobber
              exit $?
            fi

            if ! grep -qi "rate limit" release-error.log || [ "${attempt}" -eq 4 ]; then
              exit "${status}"
            fi

            sleep_seconds=$((attempt * 900))
            echo "GitHub API rate limit hit; retrying in ${sleep_seconds}s."
            sleep "${sleep_seconds}"
          done
