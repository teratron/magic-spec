name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read version
        id: version
        run: echo "value=$(cat .magic/.version)" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        run: |
          python3 - <<'EOF'
          import zipfile, os

          version = open(".magic/.version").read().strip()
          zip_name = f"magic-spec-v{version}.zip"
          prefix   = f"magic-spec-v{version}/"
          exclude  = {".magic/history", ".magic/tests", ".magic/.docs-state.json"}

          with zipfile.ZipFile(zip_name, "w", zipfile.ZIP_DEFLATED) as zf:
              for f in ("AGENTS.md", "README.md", "LICENSE"):
                  if os.path.exists(f):
                      zf.write(f, prefix + f)
              for top in (".magic", "workflows", "skills", "rules"):
                  for root, dirs, files in os.walk(top):
                      fwd = root.replace(os.sep, "/")
                      if any(fwd.startswith(ex) for ex in exclude):
                          dirs.clear()
                          continue
                      dirs[:] = [
                          d for d in dirs
                          if not any((fwd + "/" + d).startswith(ex) for ex in exclude)
                      ]
                      for f in files:
                          arc = fwd + "/" + f
                          zf.write(arc, prefix + arc)

          names = zipfile.ZipFile(zip_name).namelist()
          print(f"Created {zip_name}: {len(names)} files, {os.path.getsize(zip_name)/1024:.1f} KB")
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_PROMPT_DISABLED: 1
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          ZIP="magic-spec-v${VERSION}.zip"
          TAG="v${VERSION}"

          cat > release-notes.md <<EOF
          ## Installation

          Download \`${ZIP}\` and extract into your project root:

          \`\`\`
          your-project/
          ├── .magic/
          ├── workflows/
          ├── skills/
          └── rules/
          \`\`\`

          Then place the workflow files in your AI agent's commands directory — see [Adapter Paths](https://github.com/${{ github.repository }}#%EF%B8%8F-adapter-paths) in the README.

          Full changelog: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)
          EOF

          for attempt in 1 2 3 4; do
            if gh release create "${TAG}" "${ZIP}" --title "${TAG}" --notes-file release-notes.md 2>release-error.log; then
              exit 0
            fi

            status=$?
            cat release-error.log

            if grep -qi "already exists" release-error.log; then
              gh release upload "${TAG}" "${ZIP}" --clobber
              exit $?
            fi

            if ! grep -qi "rate limit" release-error.log || [ "${attempt}" -eq 4 ]; then
              exit "${status}"
            fi

            sleep_seconds=$((attempt * 900))
            echo "GitHub API rate limit hit; retrying in ${sleep_seconds}s."
            sleep "${sleep_seconds}"
          done
