[project]
name = "magic-spec"
version = "2.0.0"
description = "Magic Specification-Driven Development (SDD) Workflow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache License 2.0" }
authors = [{ name = "Oleg Alexandrov", email = "alexandrovoleg.ru@gmail.com" }]
dependencies = []

[project.urls]
homepage = "https://teratron.github.io/magic-spec"
repository = "https://github.com/teratron/magic-spec"

[dependency-groups]
dev = [
    "pyrefly>=0.63.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.uv]
link-mode = "copy"
